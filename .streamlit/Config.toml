[server]
# Hard cap on uploaded file size (MB). Streamlit Cloud's free tier is
# guaranteed ~1GB RAM (bursts to ~2.7GB, not reliably) -- an uncapped
# upload of a large/uncompressed video is one of the easiest ways to
# blow past that and crash the whole app. Combined with the in-app
# downscaling + frame cap in app.py, this keeps things inside budget.
maxUploadSize = 60
